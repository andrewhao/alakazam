[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alakazam"
version = "0.1.0"
description = "AI-powered intelligent document renaming with adaptive type system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andrew Hao", email = "andrew@andrewhaotung.com"},
]
keywords = ["ai", "document", "rename", "organize", "claude", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "pypdf>=4.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
all = ["alakazam[anthropic,openai,dev]"]

[project.scripts]
alakazam = "alakazam.cli.main:cli"

[project.urls]
Homepage = "https://github.com/andrewhao/alakazam"
Documentation = "https://github.com/andrewhao/alakazam#readme"
Repository = "https://github.com/andrewhao/alakazam"
Issues = "https://github.com/andrewhao/alakazam/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alakazam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
